name: Preços Crypto 12h e 18h

on:
  schedule:
    # 12:00 e 18:00 Brasília (UTC-3) → 15:00 e 21:00 UTC
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Configurar credenciais
        run: |
          mkdir -p certs data
          printf '%s' "$CONFIG_INI" > config.ini
          printf '%s' "$BOT_CONFIG_INI" > bot_config.ini
          printf '%s' "$CERT_CRT" > certs/client-2048.crt
          printf '%s' "$CERT_KEY" > certs/client-2048.key
        env:
          CONFIG_INI: ${{ secrets.CONFIG_INI }}
          BOT_CONFIG_INI: ${{ secrets.BOT_CONFIG_INI }}
          CERT_CRT: ${{ secrets.CERT_CRT }}
          CERT_KEY: ${{ secrets.CERT_KEY }}

      - name: Restaurar offset Telegram
        uses: actions/cache/restore@v4
        with:
          path: data/telegram_offset.txt
          key: telegram-offset

      - name: Enviar preços
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: python telegram_bot/send_prices_once.py

      - name: Salvar offset Telegram
        uses: actions/cache/save@v4
        with:
          path: data/telegram_offset.txt
          key: telegram-offset
