name: Apostas — Confirmar Aposta

on:
  workflow_dispatch:
    inputs:
      opp_id:
        description: "ID da oportunidade (copie do Telegram após a varredura)"
        required: true
        type: string

run-name: "Apostar ${{ inputs.opp_id }}"

jobs:
  bet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restaurar oportunidades da última varredura
        uses: actions/cache/restore@v4
        with:
          path: data/pending_opportunities.json
          key: apostas-pending-opps
          fail-on-cache-miss: true

      - name: Instalar dependências
        run: pip install requests

      - name: Configurar credenciais Betfair
        run: |
          mkdir -p certs data logs
          printf '%s' "$CONFIG_INI" > config.ini
          printf '%s' "$BOT_CONFIG_INI" > bot_config.ini
          printf '%s' "$CERT_CRT" > certs/client-2048.crt
          printf '%s' "$CERT_KEY" > certs/client-2048.key
        env:
          CONFIG_INI: ${{ secrets.CONFIG_INI }}
          BOT_CONFIG_INI: ${{ secrets.BOT_CONFIG_INI }}
          CERT_CRT: ${{ secrets.CERT_CRT }}
          CERT_KEY: ${{ secrets.CERT_KEY }}

      - name: Colocar aposta
        run: python bet_once.py "${{ inputs.opp_id }}"
